name: Raw data collection rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: housing-pages
  cancel-in-progress: true

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Suspend superseded data processing
        run: echo 'Legacy processing is suspended. The user requested raw official-source collection only.'
