name: Python package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'python/hk_property_data/**'
      - 'pyproject.toml'
      - 'requirements-residential.txt'
      - 'updater/tests/test_residential*.py'
      - 'updater/tests/residential_fixtures.py'
      - '.github/workflows/python-package.yml'

permissions:
  contents: write

concurrency:
  group: residential-python-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-residential.txt
      - run: python -m pip install -r requirements-residential.txt
      - name: Test reader, grouping and export compatibility
        run: PYTHONPATH=python python -m unittest discover -s updater/tests -p 'test_residential*.py'
      - name: Build the reader wheel
        run: python -m pip wheel . --no-deps --wheel-dir package-dist
      - name: Publish package independently of official-source collection
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view residential-data-latest >/dev/null 2>&1 || gh release create residential-data-latest --title 'Hong Kong Residential Data — latest' --notes 'Official-source dataset and Python reader. See README for usage and data coverage.'
          gh release upload residential-data-latest package-dist/*.whl --clobber
