name: Residential Excel collection

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'
  push:
    branches: [main, codex/residential-excel-2002]
    paths:
      - 'python/hk_property_data/simple/**'
      - 'scripts/collect_residential.py'
      - 'requirements-residential.txt'
      - '.github/workflows/residential-data.yml'

permissions:
  contents: write

concurrency:
  group: residential-excel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-residential.txt
      - run: python -m pip install -r requirements-residential.txt
      - name: Run extraction and export safeguards
        run: PYTHONPATH=python python -m unittest discover -s updater/tests -p 'test_simple_*.py'
      - name: Collect from an empty output directory
        run: python scripts/collect_residential.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residential-data-${{ github.run_id }}
          path: outputs/residential_2002/
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable dataset
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view residential-data-latest >/dev/null 2>&1 || gh release create residential-data-latest --title 'Hong Kong Residential Data — latest' --notes 'Official-source Excel and CSV from 2002. See collection_status.json and the workbook Data_Dictionary for coverage.'
          gh release upload residential-data-latest outputs/residential_2002/HK_Residential_Data.xlsx outputs/residential_2002/observations.csv outputs/residential_2002/collection_status.json --clobber
