name: Residential Excel collection

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Daily 18:00 Asia/Hong_Kong (UTC+8)
  push:
    branches: [main, codex/residential-excel-2002, codex/residential-cloud-reader]
    paths:
      - 'python/hk_property_data/simple/**'
      - 'python/hk_property_data/collectors/hk_landreg_collector.py'
      - 'python/hk_property_data/residential*.py'
      - 'python/hk_property_data/__init__.py'
      - 'pyproject.toml'
      - 'updater/tests/test_residential*.py'
      - 'scripts/collect_residential.py'
      - 'requirements-residential.txt'
      - '.github/workflows/residential-data.yml'

permissions:
  contents: write

concurrency:
  group: residential-excel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-residential.txt
      - run: python -m pip install -r requirements-residential.txt
      - name: Run extraction and export safeguards
        run: |
          PYTHONPATH=python python -m unittest discover -s updater/tests -p 'test_simple_*.py'
          PYTHONPATH=python python -m unittest discover -s updater/tests -p 'test_residential*.py'
      - name: Build lightweight Python reader
        run: python -m pip wheel . --no-deps --wheel-dir package-dist
      - name: Collect from an empty output directory
        run: |
          git fetch origin residential-data
          git show FETCH_HEAD:observations.parquet > "$RUNNER_TEMP/previous-residential.parquet"
          python scripts/collect_residential.py --previous-snapshot "$RUNNER_TEMP/previous-residential.parquet"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residential-data-${{ github.run_id }}
          path: outputs/residential_2002/
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable dataset
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view residential-data-latest >/dev/null 2>&1 || gh release create residential-data-latest --title 'Hong Kong Residential Data — latest' --notes 'Official-source Excel and CSV from 2002. See collection_status.json and the workbook Data_Dictionary for coverage.'
          gh release upload residential-data-latest outputs/residential_2002/HK_Residential_Data.xlsx outputs/residential_2002/observations.csv outputs/residential_2002/observations.csv.gz outputs/residential_2002/observations.parquet outputs/residential_2002/observations.sqlite outputs/residential_2002/collection_status.json outputs/residential_2002/INDICATORS.md package-dist/*.whl --clobber
      - name: Publish direct Parquet endpoint atomically
        if: success() && github.ref == 'refs/heads/main'
        run: |
          target="$RUNNER_TEMP/residential-data-publish"
          if git fetch origin residential-data; then
            git worktree add --detach "$target" FETCH_HEAD
          else
            git worktree add --detach "$target" HEAD
            git -C "$target" checkout --orphan residential-data
          fi
          rsync -a --delete --exclude=.git outputs/residential_2002/api/ "$target/"
          git -C "$target" config user.name 'github-actions[bot]'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add -A
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m 'Publish residential Parquet snapshot'
            git -C "$target" push origin HEAD:refs/heads/residential-data
          fi
