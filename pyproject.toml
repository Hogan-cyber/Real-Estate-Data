[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-property-data"
version = "0.1.2"
description = "Official Hong Kong property data collection and validated Excel/SQLite exports"
readme = "PYTHON_PACKAGE.md"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11,<0.12", "pypdf>=5,<7", "XlsxWriter>=3.2,<4", "xlrd>=2.0.1,<3"]

[project.urls]
Repository = "https://github.com/Hogan-cyber/Real-Estate-Data"
Dashboard = "https://hogan-cyber.github.io/Real-Estate-Data/"

[project.scripts]
hk-property-data = "hk_property_data.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["hk_property_data*"]

[tool.setuptools]
include-package-data = false
